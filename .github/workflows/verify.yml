name: Verify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: make verify
      - run: npm run build

  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-resume.txt
      - name: Install PDF renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0
      - run: python -m pip install -r scripts/requirements-resume.txt
      - run: python -m unittest discover -s scripts -p 'test_resume.py'
